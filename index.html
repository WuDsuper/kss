<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ฐานข้อมูลตัวชี้วัด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    --bg:#f2f6ff; --panel:#ffffff; --ink:#1b2340; --muted:#5d6785; --line:#dfe6f5;
    --accent:#4f46e5; --accent-2:#06b6d4; --accent-soft:#eef0ff;
    --between:#c2410c; --between-soft:#fff1e6; --between-line:#fb923c;
    --final:#047857; --final-soft:#e3faf0; --final-line:#10b981;
    --radius:14px; --shadow:0 4px 16px rgba(79,70,229,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;display:flex;flex-direction:column;min-height:100vh}
  header{background:linear-gradient(120deg,#4f46e5 0%,#7c3aed 45%,#06b6d4 100%);color:#fff;padding:26px 24px 30px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.12)}
  header h1{margin:0;font-size:1.5rem;font-weight:700;position:relative}
  header p{margin:4px 0 0;color:rgba(255,255,255,.92);font-size:.98rem;position:relative}
  .source{font-size:.85rem;margin-top:10px;display:inline-block;background:rgba(255,255,255,.18);padding:3px 12px;border-radius:999px;position:relative}
  .wrap{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:22px 24px;max-width:1400px;margin:0 auto;width:100%;flex:1}
  aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  aside{align-self:start;position:sticky;top:12px;border-top:4px solid var(--accent)}
  label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px;color:#3730a3}
  label:first-child{margin-top:0}
  select,input[type=search]{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fbfcff;transition:border-color .15s,box-shadow .15s}
  select:focus,input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{flex:1;border:0;background:#fff;padding:7px 2px;font:inherit;font-size:.84rem;white-space:nowrap;cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:linear-gradient(120deg,#4f46e5,#7c3aed);color:#fff}
  .btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer;color:#3730a3;font-weight:500;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--accent-soft);border-color:#c7cbfb}
  .btn.primary{background:linear-gradient(120deg,#4f46e5,#7c3aed);border-color:transparent;color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .stat{border-radius:var(--radius);padding:12px 16px;color:#fff;box-shadow:var(--shadow)}
  .stat:nth-child(1){background:linear-gradient(135deg,#4f46e5,#7c3aed)}
  .stat:nth-child(2){background:linear-gradient(135deg,#f97316,#f59e0b)}
  .stat:nth-child(3){background:linear-gradient(135deg,#10b981,#06b6d4)}
  .stat b{display:block;font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat span{font-size:.9rem;opacity:.95}
  .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .group-title{font-weight:700;margin:18px 0 8px;font-size:1.02rem;color:#4338ca;padding-left:10px;border-left:4px solid var(--accent-2)}
  .group-title:first-child{margin-top:2px}
  .std{font-size:.88rem;color:var(--muted);margin:-4px 0 8px 14px}
  .item{display:grid;grid-template-columns:24px 150px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--final-line);border-radius:10px;background:#fff;margin-bottom:6px;transition:transform .12s,box-shadow .12s}
  .item.is-between{border-left-color:var(--between-line)}
  .item:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(79,70,229,.12)}
  .item input{accent-color:var(--accent);width:16px;height:16px;margin-top:4px}
  .code{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:#312e81}
  .badge{display:inline-block;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
  .badge.between{background:var(--between-soft);color:var(--between)}
  .badge.final{background:var(--final-soft);color:var(--final)}
  .meta{font-size:.82rem;color:var(--muted);font-weight:400}
  .link{background:none;border:0;color:#0891b2;cursor:pointer;font:inherit;font-size:.85rem;padding:0;white-space:nowrap;font-weight:600}
  .link:hover{text-decoration:underline}
  mark{background:#fde68a;padding:0 2px;border-radius:3px}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:min(520px,100%);background:#fff;border-left:4px solid var(--accent);box-shadow:-8px 0 30px rgba(49,46,129,.15);padding:20px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:10}
  .drawer.open{transform:none}
  .drawer h2{font-size:1.15rem;margin:0 0 4px;color:#3730a3}
  .drawer h3{font-size:.95rem;margin:16px 0 6px;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:#3730a3}
  .drawer li{margin-bottom:6px}
  .close{float:right}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  footer{background:linear-gradient(120deg,#312e81 0%,#4c1d95 50%,#155e75 100%);color:#fff;text-align:center;padding:22px 20px;margin-top:10px;line-height:1.8}
  footer .org{font-weight:700;font-size:1.02rem}
  footer .dev{font-size:.92rem;opacity:.92}
  @media (max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static}.item{grid-template-columns:24px 1fr}.item .code{grid-column:2}.item .txt{grid-column:2}.item .side{grid-column:2}.stats{gap:8px}.stat b{font-size:1.4rem}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
  <div class="source" id="source">กำลังโหลดข้อมูล</div>
</header>

<div class="wrap">
  <aside>
    <label for="q">ค้นหารหัสหรือข้อความ</label>
    <input type="search" id="q" placeholder="เช่น ค 1.1 ป.4 หรือ เศษส่วน">
    <label for="subject">กลุ่มสาระการเรียนรู้</label>
    <select id="subject"></select>
    <label for="grade">ระดับชั้น</label>
    <select id="grade"></select>
    <label for="standard">มาตรฐาน</label>
    <select id="standard"></select>
    <label>ประเภทตัวชี้วัด</label>
    <div class="seg" id="type">
      <button data-v="" class="on">ทั้งหมด</button>
      <button data-v="ระหว่างทาง">ระหว่างทาง</button>
      <button data-v="ปลายทาง">ปลายทาง</button>
    </div>
    <label for="groupBy">จัดกลุ่มการแสดงผล</label>
    <select id="groupBy">
      <option value="grade">ชั้น และมาตรฐาน</option>
      <option value="group">กลุ่มตัวชี้วัด (ระหว่างทางสู่ปลายทาง)</option>
      <option value="none">ไม่จัดกลุ่ม</option>
    </select>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn" id="reset">ล้างตัวกรอง</button>
    </div>
  </aside>

  <main>
    <div class="stats">
      <div class="stat"><b id="sAll">0</b><span>ตัวชี้วัดที่พบ</span></div>
      <div class="stat"><b id="sBetween">0</b><span>ตัวชี้วัดระหว่างทาง</span></div>
      <div class="stat"><b id="sFinal">0</b><span>ตัวชี้วัดปลายทาง</span></div>
    </div>
    <div class="toolbar">
      <div class="muted" id="selInfo">เลือกไว้ 0 รายการ</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="selVisible">เลือกทั้งหมดที่แสดง</button>
        <button class="btn" id="showSel">ดูรายการที่เลือก</button>
        <button class="btn" id="csvVisible">ส่งออก CSV (ที่แสดง)</button>
      </div>
    </div>
    <div id="list" class="panel"></div>
  </main>
</div>

<footer>
  <div class="org">กลุ่มนิเทศติดตามฯ สพป.นครศรีธรรมราช เขต 1</div>
  <div class="dev">ผู้พัฒนา นายสรวิศ จันพุ่ม ตำแหน่งศึกษานิเทศก์ ปฏิบัติหน้าที่ ผอ.กลุ่ม DLICT</div>
  <div class="copy">&copy; 2026 สำนักงานเขตพื้นที่การศึกษาประถมศึกษานครศรีธรรมราช เขต 1 สงวนลิขสิทธิ์</div>
</footer>

<div class="drawer" id="drawer" aria-hidden="true">
  <button class="btn close" id="closeDrawer">ปิด</button>
  <div id="drawerBody"></div>
</div>

<script>
(function(){
  const C = window.APP_CONFIG || {};
  const TH = '๐๑๒๓๔๕๖๗๘๙';
  const toArabic = s => String(s ?? '').replace(/[๐-๙]/g, d => TH.indexOf(d));
  const key = s => toArabic(s).replace(/\s+/g,'').toLowerCase();
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };

  let DB = {subjects:[], strands:[], standards:[], summary:[], indicators:[]};
  let byCode = {}, stdText = {}, strandName = {};
  const state = { q:'', subject:'', grade:'', standard:'', type:'', groupBy:'grade' };
  let selected = new Set(store.get('kss_selected', []));
  let visible = [];

  $('title').textContent = C.TITLE || 'ฐานข้อมูลตัวชี้วัด';
  $('subtitle').textContent = C.SUBTITLE || '';

  async function load(){
    let payload = null, src = '';
    if (C.API_URL) {
      try {
        const r = await fetch(C.API_URL + (C.API_URL.includes('?') ? '&' : '?') + 'action=all');
        payload = await r.json();
        if (!payload.ok) throw new Error(payload.error);
        src = 'ข้อมูลจาก Google Sheet ณ ' + new Date(payload.generated_at).toLocaleString('th-TH');
      } catch(e) { payload = null; console.warn('อ่าน API ไม่สำเร็จ', e); }
    }
    if (!payload) {
      const r = await fetch(C.FALLBACK_JSON || 'data/indicators.json');
      payload = await r.json();
      src = 'ข้อมูลจากไฟล์ในคลัง ' + (payload.generated_at ? 'ปรับปรุงเมื่อ ' + new Date(payload.generated_at).toLocaleString('th-TH') : '');
      if (payload.sample) src += ' (' + payload.note + ')';
    }
    DB = Object.assign(DB, payload.data || {});
    DB.indicators.forEach(r => {
      r.grade_order = Number(r.grade_order); r.seq = Number(r.seq); r.strand_no = Number(r.strand_no);
      r._k = key(r.code + ' ' + r.code_th + ' ' + r.text);
      byCode[r.code] = r;
    });
    DB.standards.forEach(s => stdText[s.standard_code] = s.text);
    DB.strands.forEach(s => strandName[s.subject_code + '|' + s.strand_no] = s.strand_name);
    $('source').textContent = src;
    buildFilters(); render();
  }

  function subjectOrder(code){ const s = DB.subjects.find(x => x.subject_code === code); return s ? Number(s.subject_order) : 99; }
  function subjectName(code){ const s = DB.subjects.find(x => x.subject_code === code); return s ? s.subject_name : code; }

  function fillSelect(el, items, allLabel, current){
    el.innerHTML = '<option value="">' + allLabel + '</option>' + items.map(i => '<option value="' + esc(i.v) + '">' + esc(i.t) + '</option>').join('');
    el.value = items.some(i => i.v === current) ? current : '';
  }

  function buildFilters(){
    const subs = [...new Set(DB.indicators.map(r => r.subject_code))].sort((a,b) => subjectOrder(a) - subjectOrder(b));
    fillSelect($('subject'), subs.map(s => ({v:s, t:subjectName(s)})), 'ทุกกลุ่มสาระ', state.subject);
    state.subject = $('subject').value;
    refreshDependent();
  }

  function refreshDependent(){
    const base = DB.indicators.filter(r => !state.subject || r.subject_code === state.subject);
    const grades = [...new Map(base.map(r => [r.grade, r.grade_order])).entries()].sort((a,b) => a[1] - b[1]);
    fillSelect($('grade'), grades.map(([g]) => ({v:g, t:g})), 'ทุกชั้น', state.grade);
    state.grade = $('grade').value;
    const stds = [...new Set(base.map(r => r.standard_code))].sort((a,b) => key(a).localeCompare(key(b), 'th', {numeric:true}));
    fillSelect($('standard'), stds.map(s => ({v:s, t:s + (stdText[s] ? ' ' + stdText[s].slice(0,40) + (stdText[s].length > 40 ? '...' : '') : '')})), 'ทุกมาตรฐาน', state.standard);
    state.standard = $('standard').value;
  }

  function filtered(){
    const q = key(state.q);
    return DB.indicators.filter(r =>
      (!state.subject || r.subject_code === state.subject) &&
      (!state.grade || r.grade === state.grade) &&
      (!state.standard || r.standard_code === state.standard) &&
      (!state.type || r.type === state.type) &&
      (!q || r._k.includes(q))
    ).sort((a,b) => subjectOrder(a.subject_code) - subjectOrder(b.subject_code) || a.grade_order - b.grade_order ||
      key(a.standard_code).localeCompare(key(b.standard_code), 'th', {numeric:true}) || a.seq - b.seq);
  }

  function highlight(text){
    const q = state.q.trim();
    if (!q || /\d/.test(q)) return esc(text);
    const i = text.indexOf(q);
    return i < 0 ? esc(text) : esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }

  function itemHTML(r){
    const cls = r.type === 'ระหว่างทาง' ? 'between' : 'final';
    return '<div class="item' + (cls === 'between' ? ' is-between' : '') + '">' +
      '<input type="checkbox" data-sel="' + esc(r.code) + '"' + (selected.has(r.code) ? ' checked' : '') + ' aria-label="เลือก ' + esc(r.code) + '">' +
      '<div class="code">' + esc(r.code_th || r.code) + '<div class="meta">' + esc(subjectName(r.subject_code)) + '</div></div>' +
      '<div class="txt">' + highlight(r.text) + '<div class="meta">สาระที่ ' + r.strand_no + ' ' + esc(r.strand_name || '') + ' | กลุ่มที่ ' + esc(r.group_no) + '</div></div>' +
      '<div class="side" style="text-align:right"><span class="badge ' + cls + '">' + esc(r.type) + '</span><br>' +
      '<button class="link" data-group="' + esc(r.group_key) + '">ดูความเชื่อมโยง</button></div>' +
    '</div>';
  }

  function render(){
    visible = filtered();
    $('sAll').textContent = visible.length;
    $('sBetween').textContent = visible.filter(r => r.type === 'ระหว่างทาง').length;
    $('sFinal').textContent = visible.filter(r => r.type === 'ปลายทาง').length;
    if (!visible.length) { $('list').innerHTML = '<div class="empty">ไม่พบตัวชี้วัดตามเงื่อนไข</div>'; updateSel(); return; }
    if (state.groupBy === 'group') {
      // ให้ตัวชี้วัดในกลุ่มเดียวกันอยู่ติดกัน โดยแสดงระหว่างทางก่อนปลายทาง
      visible.sort((a,b) => subjectOrder(a.subject_code) - subjectOrder(b.subject_code) || a.grade_order - b.grade_order ||
        String(a.group_key).localeCompare(String(b.group_key), 'th', {numeric:true}) ||
        (a.type === b.type ? a.seq - b.seq : a.type === 'ระหว่างทาง' ? -1 : 1));
    }
    let html = '', last = '';
    const many = new Set(visible.map(r => r.subject_code)).size > 1;
    for (const r of visible) {
      if (state.groupBy === 'grade') {
        const h = (many ? subjectName(r.subject_code) + ' ' : '') + 'ชั้น ' + r.grade + '|' + r.standard_code;
        if (h !== last) {
          const [g, s] = h.split('|');
          html += '<div class="group-title">' + esc(g) + ' มาตรฐาน ' + esc(s) + '</div>' + (stdText[s] ? '<div class="std">' + esc(stdText[s]) + '</div>' : '');
          last = h;
        }
      } else if (state.groupBy === 'group' && r.group_key !== last) {
        html += '<div class="group-title">' + esc(subjectName(r.subject_code)) + ' ชั้น ' + esc(r.grade) + ' กลุ่มที่ ' + esc(r.group_no) + '</div>';
        last = r.group_key;
      }
      html += itemHTML(r);
    }
    $('list').innerHTML = html;
    updateSel();
  }

  function updateSel(){
    $('selInfo').textContent = 'เลือกไว้ ' + selected.size + ' รายการ';
    store.set('kss_selected', [...selected]);
  }

  function showGroup(gk){
    const items = DB.indicators.filter(r => r.group_key === gk);
    if (!items.length) return;
    const f = items[0];
    const list = t => items.filter(r => r.type === t).sort((a,b) => a.seq - b.seq)
      .map(r => '<li><b>' + esc(r.code_th || r.code) + '</b> ' + esc(r.text) + '</li>').join('') || '<li class="muted">ไม่มี</li>';
    $('drawerBody').innerHTML =
      '<h2>' + esc(subjectName(f.subject_code)) + ' ชั้น ' + esc(f.grade) + ' กลุ่มที่ ' + esc(f.group_no) + '</h2>' +
      '<div class="muted">สาระที่ ' + f.strand_no + ' ' + esc(f.strand_name || '') + '</div>' +
      '<h3>ตัวชี้วัดระหว่างทาง (ประเมินเพื่อพัฒนา)</h3><ul>' + list('ระหว่างทาง') + '</ul>' +
      '<h3>ตัวชี้วัดปลายทาง (ประเมินเพื่อตัดสินผล)</h3><ul>' + list('ปลายทาง') + '</ul>';
    openDrawer();
  }

  function showSelected(){
    const items = [...selected].map(c => byCode[c]).filter(Boolean)
      .sort((a,b) => subjectOrder(a.subject_code) - subjectOrder(b.subject_code) || a.grade_order - b.grade_order || a.seq - b.seq);
    $('drawerBody').innerHTML = '<h2>รายการที่เลือกไว้ ' + items.length + ' รายการ</h2>' +
      '<div class="muted">ใช้เป็นร่างสำหรับกำหนดโครงสร้างรายวิชาหรือหน่วยการเรียนรู้</div>' +
      '<div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">' +
        '<button class="btn primary" id="csvSel"' + (items.length ? '' : ' disabled') + '>ส่งออก CSV</button>' +
        '<button class="btn" id="copySel"' + (items.length ? '' : ' disabled') + '>คัดลอกเป็นข้อความ</button>' +
        '<button class="btn" id="clearSel"' + (items.length ? '' : ' disabled') + '>ล้างรายการ</button></div>' +
      '<ul>' + items.map(r => '<li><b>' + esc(r.code_th || r.code) + '</b> ' + esc(r.text) + ' <span class="badge ' + (r.type === 'ระหว่างทาง' ? 'between' : 'final') + '">' + esc(r.type) + '</span></li>').join('') + '</ul>';
    openDrawer();
    const csvBtn = $('csvSel'); if (csvBtn) csvBtn.onclick = () => downloadCSV(items, 'ตัวชี้วัดที่เลือก.csv');
    const cp = $('copySel'); if (cp) cp.onclick = () => {
      const t = items.map(r => (r.code_th || r.code) + ' ' + r.text + ' (' + r.type + ')').join('\n');
      navigator.clipboard?.writeText(t).then(() => cp.textContent = 'คัดลอกแล้ว', () => cp.textContent = 'คัดลอกไม่สำเร็จ');
    };
    const cl = $('clearSel'); if (cl) cl.onclick = () => { selected.clear(); render(); showSelected(); };
  }

  function downloadCSV(rows, name){
    const cols = ['code_th','code','subject_name','grade','strand_no','strand_name','standard_code','type','group_no','text'];
    const head = ['รหัส','รหัส (เลขอารบิก)','กลุ่มสาระ','ชั้น','สาระที่','ชื่อสาระ','มาตรฐาน','ประเภท','กลุ่มที่','ตัวชี้วัด'];
    const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
    const csv = '﻿' + [head.map(q).join(',')].concat(rows.map(r => cols.map(c => q(c === 'subject_name' ? (r.subject_name || subjectName(r.subject_code)) : r[c])).join(','))).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function openDrawer(){ $('drawer').classList.add('open'); $('drawer').setAttribute('aria-hidden','false'); }
  function closeDrawer(){ $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden','true'); }

  let t;
  $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; render(); }, 150); });
  $('subject').onchange = e => { state.subject = e.target.value; refreshDependent(); render(); };
  $('grade').onchange = e => { state.grade = e.target.value; render(); };
  $('standard').onchange = e => { state.standard = e.target.value; render(); };
  $('groupBy').onchange = e => { state.groupBy = e.target.value; render(); };
  $('type').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$('type').children].forEach(x => x.classList.toggle('on', x === b));
    state.type = b.dataset.v; render();
  };
  $('reset').onclick = () => {
    Object.assign(state, {q:'', subject:'', grade:'', standard:'', type:''});
    $('q').value = ''; [...$('type').children].forEach((x,i) => x.classList.toggle('on', i === 0));
    buildFilters(); render();
  };
  $('list').addEventListener('change', e => {
    const c = e.target.dataset.sel; if (!c) return;
    e.target.checked ? selected.add(c) : selected.delete(c); updateSel();
  });
  $('list').addEventListener('click', e => { const g = e.target.dataset.group; if (g) showGroup(g); });
  $('selVisible').onclick = () => { visible.forEach(r => selected.add(r.code)); render(); };
  $('showSel').onclick = showSelected;
  $('csvVisible').onclick = () => downloadCSV(visible, 'ตัวชี้วัด.csv');
  $('closeDrawer').onclick = closeDrawer;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  load().catch(e => { $('source').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message; });
})();
</script>
</body>
</html>
